[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "commitclerk"
description = "AI-powered git commit messages from your staged diff. Single file, zero dependencies, and it never turns a CHANGELOG edit into a fake feat:."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Alexandre Oliveira" }]
keywords = [
    "git",
    "commit",
    "commit-message",
    "conventional-commits",
    "openai",
    "llm",
    "ai",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
# commitclerk has NO runtime dependencies, by design. Keep it that way.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/alegauss/commitclerk"
Repository = "https://github.com/alegauss/commitclerk"
Issues = "https://github.com/alegauss/commitclerk/issues"
Changelog = "https://github.com/alegauss/commitclerk/blob/main/CHANGELOG.md"

[project.scripts]
clerk = "commitclerk:main"
commitclerk = "commitclerk:main"

[tool.setuptools]
py-modules = ["commitclerk"]

[tool.setuptools.dynamic]
version = { attr = "commitclerk.__version__" }

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # pyupgrade
    "C4", # flake8-comprehensions
]
ignore = [
    # The prompt rules are long single-line strings on purpose: they are read as
    # prose by the model, and rewrapping them would put hard line breaks inside
    # individual instructions.
    "E501",
]
