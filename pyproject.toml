# ai-commit has no build step and no runtime dependencies — this file exists
# only to configure the linter so `ruff check .` behaves the same locally and
# in CI.

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # pyupgrade
    "C4", # flake8-comprehensions
]
ignore = [
    # The prompt rules are long single-line strings on purpose: they are read as
    # prose by the model, and rewrapping them would put hard line breaks inside
    # individual instructions.
    "E501",
]
