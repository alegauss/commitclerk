name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC) — there is no API token stored
# in this repository. See RELEASING.md for the one-time PyPI configuration.
#
#   * Creating a GitHub Release  -> publishes to PyPI
#   * Running this manually      -> publishes to TestPyPI (dry run of the real thing)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Check that the git tag matches __version__
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import commitclerk; print(commitclerk.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "module version: $version"
          echo "git tag:        $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($version). Bump commitclerk.__version__ or retag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/commitclerk
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI often already holds a build with this version from an
          # earlier rehearsal; do not fail the run over it.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/commitclerk
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
